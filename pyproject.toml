[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emike"
version = "0.2.0"
description = "Push-to-talk Raspberry Pi voice assistant"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "David Nichol" }]
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6.0.1",
  "requests>=2.32",
  "python-dotenv>=1.0",
  "sounddevice>=0.4.7",
  "faster-whisper>=1.1.0",
  "gpiozero>=2.0.1",
]

[project.optional-dependencies]
tts = [
  "piper-tts>=1.3.0",
]
dev = [
  "pytest>=8.3",
  "ruff>=0.7",
  "mypy>=1.12",
]

[project.scripts]
emike = "emike.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
  "yaml",
  "gpiozero",
  "faster_whisper",
  "sounddevice",
]
ignore_missing_imports = true
