name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump-version:
    name: Bump minor version on main
    if: github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bump version and update tag
        id: version
        shell: bash
        run: |
          CURRENT_VERSION="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          cfg = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))
          print(cfg['project']['version'])
          PY
          )"

          IFS='.' read -r major minor patch <<<"${CURRENT_VERSION}"
          NEXT_VERSION="${major}.$((minor + 1)).0"

          python - "${NEXT_VERSION}" <<'PY'
          import re
          import sys
          from pathlib import Path

          next_version = sys.argv[1]
          path = Path('pyproject.toml')
          text = path.read_text(encoding='utf-8')
          updated, count = re.subn(r'(?m)^version = ".*?"$', f'version = "{next_version}"', text, count=1)

          if count != 1:
              raise SystemExit('Failed to update project version in pyproject.toml')

          path.write_text(updated, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add pyproject.toml
          git commit -m "chore: bump version to v${NEXT_VERSION}" || echo "No version bump to commit"

          git tag -f "v${NEXT_VERSION}"
          git push origin HEAD:main --follow-tags

          echo "next_version=${NEXT_VERSION}" >> "$GITHUB_OUTPUT"

  release:
    name: Build and publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate tag matches project version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PYPROJECT_VERSION="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          cfg = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))
          print(cfg['project']['version'])
          PY
          )"

          echo "Tag version: ${TAG_VERSION}"
          echo "Project version: ${PYPROJECT_VERSION}"

          if [[ "${TAG_VERSION}" != "${PYPROJECT_VERSION}" ]]; then
            echo "Tag version does not match pyproject version"
            exit 1
          fi

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-dist-release
          path: dist/*
