name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate tag matches project version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PYPROJECT_VERSION="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          cfg = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))
          print(cfg['project']['version'])
          PY
          )"

          echo "Tag version: ${TAG_VERSION}"
          echo "Project version: ${PYPROJECT_VERSION}"

          if [[ "${TAG_VERSION}" != "${PYPROJECT_VERSION}" ]]; then
            echo "Tag version does not match pyproject version"
            exit 1
          fi

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-dist-release
          path: dist/*
